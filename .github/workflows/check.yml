name: Check

on: [push, pull_request, workflow_call]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package
      - name: Resolve packaged archive
        shell: bash
        run: node -e 'const fs = require("node:fs"); const version = require("./cli/package.json").version; fs.appendFileSync(process.env.GITHUB_ENV, "DEVLENS_ARCHIVE=release/devlens-" + version + ".tgz\n")'
      - name: Install and verify packaged CLI
        run: |
          npm install --global ./${{ env.DEVLENS_ARCHIVE }}
          devlen --version
          devlen --help
          devlens --version
          devlens --help
      - name: Test Unix installer
        if: runner.os != 'Windows'
        env:
          DEVLENS_PACKAGE_URL: ${{ github.workspace }}/${{ env.DEVLENS_ARCHIVE }}
          DEVLENS_INSTALL_DIR: ${{ runner.temp }}/devlens install
        run: sh scripts/install.sh
      - name: Test Windows installer
        if: runner.os == 'Windows'
        env:
          DEVLENS_PACKAGE_URL: ${{ github.workspace }}/${{ env.DEVLENS_ARCHIVE }}
          DEVLENS_INSTALL_DIR: ${{ runner.temp }}/devlens install
        shell: pwsh
        run: |
          & ./scripts/install.ps1
          devlen.cmd --help
          devlens.cmd --help
